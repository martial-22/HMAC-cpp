name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: install external dependencies
      run: sudo apt-get install libssl-dev libcpprest-dev
    - name: build
      run: chmod 111 build.sh && ./build.sh
    - name: units
      run: ./build/tests
